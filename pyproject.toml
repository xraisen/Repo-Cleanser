[project]
name = "repo-cleanser"
version = "0.1.0"
description = "Non-destructive repository governance and cleanup analysis CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.16,<1.0",
]

[project.scripts]
repo-cleanser = "repo_cleanser.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.18,<2.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.13,<0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_cleanser"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

